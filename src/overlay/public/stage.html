<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumen — Sanctuary Stage LED Wall Display</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Fullscreen background container */
    .media-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    /* Idle Sermon Series Graphic */
    .idle-graphic {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 1;
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s ease-out;
      transform: scale(1);
    }

    .idle-graphic.hidden {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    /* Ambient Video Motion Loop */
    .motion-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .motion-video.active {
      opacity: 1;
    }

    /* Readability Scrim Overlay (Crucial for Stage LED Walls) */
    .scrim {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(8, 12, 22, 0.45) 0%, rgba(3, 6, 12, 0.85) 100%);
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      z-index: 2;
    }

    .scrim.active {
      opacity: 1;
    }

    /* Scripture Presentation Layer */
    .stage-content {
      position: relative;
      z-index: 3;
      width: 88%;
      max-width: 1600px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(20px) scale(0.98);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 0 40px;
    }

    .stage-content.active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Modern Bold Sans-Serif Citation Header */
    .citation-container {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .citation-title {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #f59e0b; /* Vibrant amber/gold */
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.8);
    }

    .translation-pill {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 5px 16px;
      border-radius: 9999px;
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.5);
      color: #fef3c7;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    /* High-Impact Modern Bold Sans-Serif Scripture Body */
    .verse-body {
      font-size: 48px;
      font-weight: 700;
      line-height: 1.38;
      letter-spacing: -0.5px;
      color: #ffffff;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.9), 0 2px 8px rgba(0, 0, 0, 0.8);
      max-width: 1450px;
      margin: 0 auto;
      word-wrap: break-word;
    }

    /* Fallback Ambient CSS Glow Canvas (if no external video is loaded) */
    .ambient-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at bottom, #1e1b4b 0%, #0f172a 45%, #020617 100%);
      opacity: 0;
      transition: opacity 1s ease;
    }

    .ambient-canvas.active {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Layer 1: Media Layers (Idle Graphic + Video Motion Loop) -->
  <div class="media-layer">
    <!-- Ambient CSS fallback background -->
    <div id="ambientCanvas" class="ambient-canvas"></div>

    <!-- Background Video Motion Loop -->
    <video id="motionVideo" class="motion-video" autoplay loop muted playsinline></video>

    <!-- Idle Sermon Series Graphic -->
    <img id="idleGraphic" class="idle-graphic" src="" alt="Sermon Series Graphic">
  </div>

  <!-- Layer 2: Readability Scrim -->
  <div id="scrim" class="scrim"></div>

  <!-- Layer 3: Scripture Typography -->
  <div id="stageContent" class="stage-content">
    <div class="citation-container">
      <span id="citationText" class="citation-title">MATTHEW 1:1</span>
      <span id="translationBadge" class="translation-pill">AMPLIFIED</span>
    </div>
    <div id="verseBody" class="verse-body">
      ...
    </div>
  </div>

  <script>
    const idleGraphic = document.getElementById('idleGraphic');
    const motionVideo = document.getElementById('motionVideo');
    const ambientCanvas = document.getElementById('ambientCanvas');
    const scrim = document.getElementById('scrim');
    const stageContent = document.getElementById('stageContent');
    const citationText = document.getElementById('citationText');
    const translationBadge = document.getElementById('translationBadge');
    const verseBody = document.getElementById('verseBody');

    // Default media state
    let state = {
      idleMode: 'graphic', // 'graphic' | 'motion'
      idleGraphicUrl: '/images/default-sermon.svg',
      motionLoopUrl: '',
      isVerseActive: false
    };

    let safetyTimer = null;
    const SAFETY_CEILING_MS = 5 * 60 * 1000; // 5 minutes max

    // Set initial sermon series graphic
    idleGraphic.src = state.idleGraphicUrl;

    // Connect to Lumen WebSocket
    function connectWs() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}`;
      const ws = new WebSocket(wsUrl);

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'stage:verse') {
            displayStageVerse(msg.data);
          } else if (msg.type === 'stage:clear') {
            clearStageVerse();
          } else if (msg.type === 'stage:config') {
            updateStageConfig(msg.data);
          }
        } catch (err) {
          console.error('WS message error:', err);
        }
      };

      ws.onclose = () => {
        setTimeout(connectWs, 2000);
      };
    }

    function displayStageVerse(data) {
      if (safetyTimer) clearTimeout(safetyTimer);

      citationText.textContent = data.reference;
      translationBadge.textContent = data.translation || 'DEFAULT';
      verseBody.textContent = data.text;

      // Auto-fit font size based on text length
      adjustFontSize(data.text.length);

      // Hide idle sermon graphic, show motion video / ambient canvas, show scrim, fade in text
      idleGraphic.classList.add('hidden');
      scrim.classList.add('active');

      if (state.motionLoopUrl) {
        motionVideo.src = state.motionLoopUrl;
        motionVideo.classList.add('active');
        ambientCanvas.classList.remove('active');
      } else {
        ambientCanvas.classList.add('active');
      }

      stageContent.classList.add('active');
      state.isVerseActive = true;

      // 5-Minute Safety Ceiling: if the operator never clears, return smoothly to idle
      const timeoutMs = data.duration && data.duration > 0 ? data.duration : SAFETY_CEILING_MS;
      safetyTimer = setTimeout(() => {
        clearStageVerse();
      }, timeoutMs);
    }

    function clearStageVerse() {
      if (safetyTimer) clearTimeout(safetyTimer);

      stageContent.classList.remove('active');
      scrim.classList.remove('active');
      motionVideo.classList.remove('active');
      ambientCanvas.classList.remove('active');

      // Return smoothly to the idle graphic
      setTimeout(() => {
        idleGraphic.classList.remove('hidden');
      }, 300);

      state.isVerseActive = false;
    }

    function updateStageConfig(config) {
      if (config.idleGraphicUrl) {
        state.idleGraphicUrl = config.idleGraphicUrl;
        idleGraphic.src = config.idleGraphicUrl;
      }
      if (config.motionLoopUrl !== undefined) {
        state.motionLoopUrl = config.motionLoopUrl;
        if (state.isVerseActive && state.motionLoopUrl) {
          motionVideo.src = state.motionLoopUrl;
          motionVideo.classList.add('active');
          ambientCanvas.classList.remove('active');
        }
      }
      if (config.idleMode) {
        state.idleMode = config.idleMode;
      }
    }

    // Dynamic auto-scaling font size for stage LED legibility
    function adjustFontSize(charCount) {
      if (charCount < 100) {
        verseBody.style.fontSize = '54px';
        verseBody.style.lineHeight = '1.35';
      } else if (charCount < 250) {
        verseBody.style.fontSize = '44px';
        verseBody.style.lineHeight = '1.4';
      } else if (charCount < 450) {
        verseBody.style.fontSize = '36px';
        verseBody.style.lineHeight = '1.45';
      } else {
        verseBody.style.fontSize = '30px';
        verseBody.style.lineHeight = '1.5';
      }
    }

    connectWs();
  </script>
</body>
</html>
