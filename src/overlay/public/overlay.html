<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumen — OBS Lower Third Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 48px;
    }

    .verse-card {
      width: 90%;
      max-width: 1400px;
      background: rgba(14, 18, 27, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-left: 6px solid #d4af37;
      border-radius: 12px;
      padding: 24px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      color: #ffffff;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .verse-card.active {
      opacity: 1;
      transform: translateY(0);
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .reference-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #d4af37;
      text-transform: uppercase;
    }

    .translation-badge {
      font-size: 13px;
      font-weight: 700;
      background: rgba(212, 175, 55, 0.2);
      color: #f4edc9;
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.8px;
    }

    .verse-text {
      font-family: "Georgia", serif;
      font-size: 26px;
      line-height: 1.45;
      color: #f8fafc;
      font-weight: 400;
    }
  </style>
</head>
<body>

  <div id="card" class="verse-card">
    <div class="header-row">
      <span id="reference" class="reference-title">Book 1:1</span>
      <span id="translation" class="translation-badge">KJV</span>
    </div>
    <div id="text" class="verse-text">
      ...
    </div>
  </div>

  <script>
    const card = document.getElementById('card');
    const refEl = document.getElementById('reference');
    const transEl = document.getElementById('translation');
    const textEl = document.getElementById('text');

    let hideTimer = null;

    function connectWs() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}`;
      const ws = new WebSocket(wsUrl);

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'verse:show') {
            displayVerse(msg.data);
          } else if (msg.type === 'verse:clear' || msg.type === 'verse:hide') {
            hideVerse();
          }
        } catch (err) {
          console.error('WS parse error:', err);
        }
      };

      ws.onclose = () => {
        setTimeout(connectWs, 2000); // Reconnect loop
      };
    }

    function displayVerse(data) {
      refEl.textContent = data.reference;
      transEl.textContent = data.translation || 'DEFAULT';
      textEl.textContent = data.text;

      card.classList.add('active');

      if (hideTimer) clearTimeout(hideTimer);
      if (data.duration && data.duration > 0) {
        hideTimer = setTimeout(() => {
          hideVerse();
        }, data.duration);
      }
    }

    function hideVerse() {
      card.classList.remove('active');
    }

    connectWs();
  </script>
</body>
</html>
