<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#0f0f1a"/>

  <!-- Bible book body -->
  <rect x="120" y="110" width="230" height="290" rx="12" ry="12" fill="#f59e0b"/>

  <!-- Bible spine (left edge) -->
  <rect x="120" y="110" width="32" height="290" rx="8" ry="8" fill="#d97706"/>

  <!-- Bible pages (right side white edge) -->
  <rect x="338" y="118" width="10" height="274" rx="3" ry="3" fill="#fef3c7" opacity="0.6"/>
  <rect x="344" y="122" width="6" height="266" rx="2" ry="2" fill="#fef3c7" opacity="0.4"/>

  <!-- Cross on cover -->
  <!-- Vertical bar -->
  <rect x="243" y="165" width="22" height="110" rx="4" ry="4" fill="#0f0f1a"/>
  <!-- Horizontal bar -->
  <rect x="210" y="198" width="88" height="22" rx="4" ry="4" fill="#0f0f1a"/>

  <!-- Bookmark ribbon -->
  <polygon points="290,110 310,110 310,175 300,162 290,175" fill="#ef4444"/>

  <!-- Glow dot — the "Lumen" light element -->
  <circle cx="256" cy="370" r="14" fill="#fef3c7" opacity="0.9"/>
  <circle cx="256" cy="370" r="8" fill="#ffffff"/>

  <!-- Subtle page lines -->
  <line x1="168" y1="310" x2="320" y2="310" stroke="#d97706" stroke-width="2" opacity="0.4"/>
  <line x1="168" y1="328" x2="320" y2="328" stroke="#d97706" stroke-width="2" opacity="0.4"/>
  <line x1="168" y1="346" x2="290" y2="346" stroke="#d97706" stroke-width="2" opacity="0.4"/>
</svg>
